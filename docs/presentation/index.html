<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CPR Coach — Presentation</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --text: #f3f6ff;
      --muted: #9aa8c7;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0.75rem;
      padding: 1rem 1.25rem 1.25rem;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
      letter-spacing: 0.01em;
    }
    header p {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .links a {
      color: var(--accent-hover);
      text-decoration: none;
      margin-left: 0.85rem;
      font-size: 0.9rem;
    }
    .links a:hover { text-decoration: underline; }
    .stage-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      min-height: 0;
    }
    .nav-btn {
      appearance: none;
      border: 1px solid #2a3a5c;
      background: var(--panel);
      color: var(--text);
      width: 3rem;
      height: 3rem;
      border-radius: 999px;
      font-size: 1.4rem;
      cursor: pointer;
      flex: 0 0 auto;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .nav-btn:hover:not(:disabled) {
      background: #1a2740;
      border-color: var(--accent);
    }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .stage {
      flex: 1 1 auto;
      max-width: min(1120px, 100%);
      background: var(--panel);
      border: 1px solid #22314f;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
    }
    .stage img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
    }
    .counter {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
    }
    .dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      max-width: 720px;
    }
    .dot {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 999px;
      border: 0;
      padding: 0;
      background: #314566;
      cursor: pointer;
    }
    .dot[aria-current="true"] {
      background: var(--accent);
      width: 1.35rem;
    }
    .hint {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }
    kbd {
      background: #1a2740;
      border: 1px solid #334866;
      border-radius: 5px;
      padding: 0.05rem 0.35rem;
      font-size: 0.78rem;
    }
    @media (max-width: 700px) {
      .nav-btn { width: 2.5rem; height: 2.5rem; font-size: 1.2rem; }
      header h1 { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>CPR Coach Presentation</h1>
        <p>Congressional App Challenge · 12 slides</p>
      </div>
      <div class="links">
        <a href="Presentation.pdf">Open PDF</a>
        <a href="../../README.md">Back to README</a>
      </div>
    </header>

    <div class="stage-wrap">
      <button class="nav-btn" id="prev" aria-label="Previous slide">←</button>
      <div class="stage" id="stage">
        <img id="slide" alt="Presentation slide" />
      </div>
      <button class="nav-btn" id="next" aria-label="Next slide">→</button>
    </div>

    <footer>
      <div class="counter" id="counter">Slide 1 of 12</div>
      <div class="dots" id="dots" aria-label="Slide picker"></div>
      <p class="hint">Use <kbd>→</kbd> / <kbd>←</kbd>, click the arrows, or tap a dot. Swipe on touch devices.</p>
    </footer>
  </div>

  <script>
    const TOTAL = 12;
    const pad = (n) => String(n).padStart(2, "0");
    const slideEl = document.getElementById("slide");
    const counterEl = document.getElementById("counter");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const dotsEl = document.getElementById("dots");

    let index = 1;
    const params = new URLSearchParams(location.search);
    const start = Number(params.get("slide") || 1);
    if (Number.isFinite(start) && start >= 1 && start <= TOTAL) index = start;

    for (let i = 1; i <= TOTAL; i++) {
      const b = document.createElement("button");
      b.className = "dot";
      b.type = "button";
      b.title = `Slide ${i}`;
      b.addEventListener("click", () => show(i));
      dotsEl.appendChild(b);
    }

    function show(i) {
      index = Math.min(TOTAL, Math.max(1, i));
      slideEl.src = `slides/slide-${pad(index)}.png`;
      slideEl.alt = `CPR Coach presentation slide ${index}`;
      counterEl.textContent = `Slide ${index} of ${TOTAL}`;
      prevBtn.disabled = index === 1;
      nextBtn.disabled = index === TOTAL;
      [...dotsEl.children].forEach((dot, idx) => {
        dot.setAttribute("aria-current", idx + 1 === index ? "true" : "false");
      });
      const url = new URL(location.href);
      url.searchParams.set("slide", String(index));
      history.replaceState(null, "", url);
    }

    prevBtn.addEventListener("click", () => show(index - 1));
    nextBtn.addEventListener("click", () => show(index + 1));

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
        e.preventDefault();
        show(index + 1);
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        show(index - 1);
      } else if (e.key === "Home") {
        show(1);
      } else if (e.key === "End") {
        show(TOTAL);
      }
    });

    let touchX = null;
    const stage = document.getElementById("stage");
    stage.addEventListener("touchstart", (e) => {
      touchX = e.changedTouches[0].clientX;
    }, { passive: true });
    stage.addEventListener("touchend", (e) => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 40) show(index + (dx < 0 ? 1 : -1));
      touchX = null;
    }, { passive: true });

    show(index);
  </script>
</body>
</html>
